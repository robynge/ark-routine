name: Refresh ARK Holdings CSVs
on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC = 10:30 AM ET (EDT)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      - name: Download 17 ARK ETF CSVs
        run: |
          set -e
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          OUT="data/holdings/${DATE:0:4}/$DATE"
          mkdir -p "$OUT"
          BASE="https://assets.ark-funds.com/fund-documents/funds-etf-csv"
          declare -A URLS=(
            [ARKK]="ARK_INNOVATION_ETF_ARKK_HOLDINGS.csv"
            [ARKG]="ARK_GENOMIC_REVOLUTION_ETF_ARKG_HOLDINGS.csv"
            [ARKQ]="ARK_AUTONOMOUS_TECH._%26_ROBOTICS_ETF_ARKQ_HOLDINGS.csv"
            [ARKW]="ARK_NEXT_GENERATION_INTERNET_ETF_ARKW_HOLDINGS.csv"
            [ARKB]="ARK_21SHARES_BITCOIN_ETF_ARKB_HOLDINGS.csv"
            [ARKVX]="ARK_VENTURE_FUND_ARKVX_HOLDINGS.csv"
            [ARKX]="ARK_SPACE_%26_DEFENSE_INNOVATION_ETF_ARKX_HOLDINGS.csv"
            [ARKF]="ARK_BLOCKCHAIN_%26_FINTECH_INNOVATION_ETF_ARKF_HOLDINGS.csv"
            [IZRL]="ARK_ISRAEL_INNOVATIVE_TECHNOLOGY_ETF_IZRL_HOLDINGS.csv"
            [PRNT]="THE_3D_PRINTING_ETF_PRNT_HOLDINGS.csv"
            [ARKD]="ARK_DIET_Q1_BUFFER_ETF_ARKD_HOLDINGS.csv"
            [ARKI]="ARK_DIET_Q2_BUFFER_ETF_ARKI_HOLDINGS.csv"
            [ARKE]="ARK_DIET_Q3_BUFFER_ETF_ARKE_HOLDINGS.csv"
            [ARKT]="ARK_DIET_Q4_BUFFER_ETF_ARKT_HOLDINGS.csv"
            [ARKUX]="ARK_VENTURE_FUND_ARKUX_HOLDINGS.csv"
            [ARKSX]="ARK_VENTURE_FUND_ARKSX_HOLDINGS.csv"
            [ARKY]="ARK_ACTIVE_AUTOCALLABLE_INCOME_ETF_ARKY_HOLDINGS.csv"
          )
          for ETF in "${!URLS[@]}"; do
            curl -fsSL "$BASE/${URLS[$ETF]}" -o "$OUT/${ETF}_Holdings_${DATE}.csv" \
              || echo "WARN: $ETF download failed"
          done
          ls -la "$OUT"

      - name: Update LATEST symlink
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          rm -f data/holdings/LATEST
          (cd data/holdings && ln -s "${DATE:0:4}/$DATE" LATEST)
          ls -la data/holdings/

      # Rebuilds data/consolidated/<FUND>.csv (one per fund) from every per-day
      # CSV. Full rebuild rather than an append: it is deterministic, so a re-run
      # on the same day is a no-op the commit step sees as an empty diff, and
      # there is no incremental cursor that can drift out of sync with the archive.
      - name: Rebuild consolidated history
        run: python3 scripts/build_history.py

      # ARK's daily trades (from the trade-notification emails) are ingested into the
      # dashboard's KV by a cloud Routine every evening; the Worker republishes them as
      # CSV. Mirror that file here so the public repo carries the trade history next to
      # the holdings. Fail-soft: a Worker outage keeps yesterday's file.
      - name: Mirror ARK daily trades CSV from the dashboard
        run: |
          mkdir -p data/trades
          if curl -fsSL "https://ark-movers-dashboard.robynge.workers.dev/api/trades.csv" -o /tmp/ark_trades.csv \
             && [ "$(head -1 /tmp/ark_trades.csv)" = "Date,ETF,Direction,Ticker,Company Name,Shares Traded,% of Total ETF" ] \
             && [ "$(wc -l < /tmp/ark_trades.csv)" -ge "$(wc -l < data/trades/ark_trades.csv 2>/dev/null || echo 0)" ]; then
            mv /tmp/ark_trades.csv data/trades/ark_trades.csv
            echo "trades CSV: $(($(wc -l < data/trades/ark_trades.csv) - 1)) rows, last date $(tail -1 data/trades/ark_trades.csv | cut -d, -f1)"
          else
            echo "WARN: trades CSV not refreshed (download failed, bad header, or fewer rows than before)"
          fi

      # Monthly turnover series for the six active equity ETFs (names / shares / trading
      # turnover, see data/turnover/README.md) from the consolidated history + trades CSV.
      # Deterministic, so an unchanged month is an empty diff for the commit step.
      - name: Compute turnover series
        run: |
          python3 -m pip install -q pandas numpy
          python3 scripts/turnover.py --repo .

      - name: Commit if changed
        run: |
          git config user.email "ark-bot@github.com"
          git config user.name "ARK Refresh Bot"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh ARK CSVs $(TZ=America/New_York date +%Y-%m-%d)"
          git push
